name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGINS: "Piano Batterie Cordes"

jobs:
  linux-tests:
    name: Linux (tests de rendu + pluginval)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libgl1-mesa-dev ninja-build
      - name: Configure & build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Offline render tests (non silencieux, sans saturation)
        run: bash tests/run_render_tests.sh build/atelier_render_artefacts/Release/atelier_render renders
      - name: pluginval (VST3, Linux)
        run: |
          curl -sL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -oq pv.zip
          for p in $PLUGINS; do
            ./pluginval --strictness-level 8 --skip-gui-tests --validate-in-process --timeout-ms 300000 "build/Atelier${p}_artefacts/Release/VST3/Atelier ${p}.vst3"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: renders-audio
          path: renders/*.wav

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure & build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DATELIER_BUILD_TESTS=OFF
          cmake --build build --config Release --parallel
      - name: Collect plugins
        shell: bash
        run: |
          mkdir -p dist/win
          for p in $PLUGINS; do cp -r "build/Atelier${p}_artefacts/Release/VST3/Atelier ${p}.vst3" dist/win/; done
          ls -R dist/win | head -50
      - name: pluginval (VST3)
        shell: bash
        run: |
          curl -sL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -oq pv.zip
          for p in $PLUGINS; do
            ./pluginval.exe --strictness-level 8 --skip-gui-tests --validate-in-process --timeout-ms 300000 "dist/win/Atelier ${p}.vst3"
          done
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.1.0 /Odist packaging\windows-installer.iss
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item packaging\INSTALLER-Windows.txt dist\win\LISEZ-MOI.txt
          Compress-Archive -Path dist\win\* -DestinationPath dist\AtelierInstruments-0.1.0-Windows-x64-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  macos:
    name: macOS universel (Intel + Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure & build (universal x86_64 + arm64)
        run: |
          cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 -DATELIER_BUILD_TESTS=OFF
          cmake --build build --config Release --parallel -- -quiet
      - name: Collect, check architectures, ad-hoc sign
        run: |
          mkdir -p dist/mac/VST3 dist/mac/Components
          for p in $PLUGINS; do
            cp -R "build/Atelier${p}_artefacts/Release/VST3/Atelier ${p}.vst3" dist/mac/VST3/
            cp -R "build/Atelier${p}_artefacts/Release/AU/Atelier ${p}.component" dist/mac/Components/
            lipo -info "dist/mac/VST3/Atelier ${p}.vst3/Contents/MacOS/Atelier ${p}"
            lipo -info "dist/mac/Components/Atelier ${p}.component/Contents/MacOS/Atelier ${p}" | grep x86_64
          done
          for b in dist/mac/VST3/*.vst3 dist/mac/Components/*.component; do codesign --force --deep -s - "$b"; done
      - name: auval (Audio Unit)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R dist/mac/Components/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -a | grep -i atln || true
          for code in AtPn AtDr AtCo; do auval -strict -v aumu $code Atln; done
      - name: pluginval (VST3 + AU)
        run: |
          curl -sL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -oq pv.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          for p in $PLUGINS; do
            $PV --strictness-level 8 --skip-gui-tests --validate-in-process --timeout-ms 300000 "dist/mac/VST3/Atelier ${p}.vst3"
            $PV --strictness-level 5 --skip-gui-tests --validate-in-process --timeout-ms 300000 "$HOME/Library/Audio/Plug-Ins/Components/Atelier ${p}.component"
          done
      - name: Package (.pkg + .zip)
        run: |
          mkdir -p pkgroot/Library/Audio/Plug-Ins
          cp -R dist/mac/VST3 dist/mac/Components pkgroot/Library/Audio/Plug-Ins/
          pkgbuild --root pkgroot --identifier org.atelier.instruments --version 0.1.0 --install-location / dist/AtelierInstruments-0.1.0-macOS-universal.pkg
          cp packaging/INSTALLER-macOS.txt dist/mac/LISEZ-MOI.txt
          (cd dist/mac && ditto -c -k --sequesterRsrc --keepParent . ../AtelierInstruments-0.1.0-macOS-universal-VST3-AU.zip)
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.pkg
            dist/*.zip

  release:
    name: Release GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-tests, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -R artifacts
          gh release create "${GITHUB_REF_NAME}" --title "Atelier Instruments ${GITHUB_REF_NAME}" --notes-file packaging/RELEASE_NOTES.md \
            artifacts/windows/* artifacts/macos/* || \
          gh release upload "${GITHUB_REF_NAME}" artifacts/windows/* artifacts/macos/* --clobber
